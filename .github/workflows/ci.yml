name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust core (CommonMark 0.31 + GFM + footnotes + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/brookmd-core
      - name: cargo test (enforces the 652/652 + GFM floors + proptest parity)
        working-directory: crates/brookmd-core
        env:
          CMARK_MIN_PASS: "652"
          GFM_MIN_PASS: "24"
          # Byte-exact floors: the normalized floors above allow whitespace
          # laxity, these do not. Both harnesses already default to these
          # numbers; pinning them here keeps the gate visible in the workflow.
          CMARK_MIN_EXACT: "652"
          GFM_MIN_EXACT: "24"
        run: cargo test --release
      - name: Complexity-scaling gate (deterministic work-counter, not wall-clock)
        # Asserts streaming stays sub-quadratic on the committing/cached shapes,
        # by counting slow-path tail re-scan bytes (feature `perf_counters`, off
        # in every shipped build). Catches O(n²) cliffs before merge — the class
        # we used to find only after shipping (0.18.2/0.18.3/0.18.4).
        working-directory: crates/brookmd-core
        run: cargo test --release --features perf_counters --test scaling

  bindings:
    name: FFI/C-ABI tests + generated-bindings freshness
    # bindings-build.yml / cabi-build.yml cover the same crates, but only on
    # `pull_request` behind `paths:` filters — so a push to main, or a PR that
    # only touches the JS side, gates on nothing. That is how stale binding
    # goldens survived. This job is the unconditional floor: it runs on every
    # push and every PR, on one ubuntu runner, host-only (no JDK/Xcode — the
    # generators are metadata-driven and arch-independent).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/brookmd-ffi
            crates/brookmd-cabi
      - name: cargo test (uniffi FFI layer — wire goldens + config parity)
        working-directory: crates/brookmd-ffi
        run: cargo test --release
      - name: cargo test (C ABI layer — wire goldens + symbol-drift tripwire)
        working-directory: crates/brookmd-cabi
        # Build first so the release cdylib exists and the symbol-drift test's
        # `nm -D` check runs against a real artifact instead of skipping.
        run: |
          cargo build --release
          cargo test --release
      - name: Build the release staticlib (uniffi metadata source)
        # uniffi library mode reads the interface metadata from the compiled
        # library's symbol table. The release cdylib is `strip = true`, which
        # drops those symbols, so the generators read the release STATICLIB.
        # bindings/*/scripts/generate.sh build it themselves; ubrn:generate does
        # not, so it must exist before the React Native generator runs.
        working-directory: crates/brookmd-ffi
        run: cargo build --release
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The three freshness checks below are the ones both generate.sh headers
      # already claim CI performs: regenerate, then fail on any diff, so the
      # committed bindings can never lag the FFI crate.
      - name: Regenerate React Native bindings (ubrn)
        working-directory: packages/brookmd-react-native
        run: bun run ubrn:generate
      - name: Freshness check (generated TS/C++ matches committed)
        run: >
          git diff --exit-code
          packages/brookmd-react-native/src/generated
          packages/brookmd-react-native/cpp/generated
      - name: Regenerate Kotlin bindings
        run: bash bindings/kotlin/scripts/generate.sh
      - name: Freshness check (generated Kotlin matches committed)
        run: git diff --exit-code bindings/kotlin/brookmd/src/main/kotlin
      - name: Regenerate Swift bindings
        run: bash bindings/swift/scripts/generate.sh
      - name: Freshness check (generated Swift matches committed)
        run: git diff --exit-code bindings/swift/Sources/BrookMd/brook_md_ffi.swift

  js:
    name: WASM build + JS package (types, component/pool/store tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install nightly + rust-src for the size-optimized WASM build
        # build:wasm uses -Z build-std + panic=immediate-abort (nightly only) to
        # shrink the binary; that needs the nightly toolchain with the rust-src
        # component and the wasm target. Native cargo stays on stable above.
        run: rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/brookmd-core
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build WASM
        run: bun run build:wasm
      - name: Build the compiled package (dist)
        working-directory: packages/brookmd
        # `npm publish` runs prepublishOnly (build:wasm + this build); `npm pack`
        # does NOT run prepublishOnly, so build dist explicitly before the tarball
        # tripwire below, otherwise it packs a stale/empty dist.
        run: node scripts/build.mjs
      - name: Assert the publish tarball ships a non-empty WASM artifact
        working-directory: packages/brookmd
        # The package ships compiled `dist` (files:["dist"]); the WASM lands at
        # dist/wasm/brook_md_core_bg.wasm. Tripwire against a silently WASM-less
        # publish. Pack into a clean temp dir and glob the tarball (don't parse
        # npm's stdout, which varies by version).
        run: |
          set -euo pipefail
          dest="$(mktemp -d)"
          npm pack --pack-destination "$dest" >/dev/null 2>&1
          tarball="$(echo "$dest"/*.tgz)"
          test -f "$tarball" || { echo "::error::npm pack produced no tarball"; exit 1; }
          tar -tzf "$tarball" | grep -q '/dist/wasm/brook_md_core_bg\.wasm$' \
            || { echo "::error::publish tarball is missing dist/wasm/brook_md_core_bg.wasm"; exit 1; }
          size=$(tar -tzvf "$tarball" | awk '/\/dist\/wasm\/brook_md_core_bg\.wasm$/ { print $3; exit }')
          test "${size:-0}" -gt 0 || { echo "::error::WASM artifact is present but empty"; exit 1; }
          echo "OK: tarball ships WASM (${size} bytes)"
          rm -rf "$dest"
      - name: Typecheck the package
        working-directory: packages/brookmd
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Typecheck the tests
        working-directory: packages/brookmd
        run: bunx tsc --noEmit -p tsconfig.test.json
      - name: Typecheck the agent-skill examples
        # `skills/brookmd/` is what `npx skills add siinghd/brookmd` installs.
        # Its examples are real TS files resolved against packages/brookmd/src,
        # so an API rename that the docs don't follow fails here, not in a
        # user's agent session. (test/skill-docs.test.ts covers what tsc can't:
        # frontmatter, links, subpath names, the no-other-libraries rule.)
        run: bunx tsc -p skills/brookmd/assets/examples/tsconfig.json
      - name: Component / pool / store tests
        run: bun run test:components
      - name: SSR cold-import (fresh process, no browser globals)
        # Load-bearing SSR guard: a fresh process so module top-level code runs
        # cold (the in-process ssr.test.ts can pass under bun's warm cache). Trips
        # if any entrypoint touches a browser global at import/construct/render.
        working-directory: packages/brookmd
        run: bun run test:ssr-cold
      - name: Web build
        run: bun run build:web
